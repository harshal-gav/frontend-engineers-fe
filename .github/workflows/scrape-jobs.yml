name: Scrape Remote Jobs (Remote APIs & LinkedIn)

on:
  schedule:
    # Run twice a day (e.g., at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: {}  # Manual trigger to run it whenever you want

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run Scraper Pipeline (Remote APIs + LinkedIn)
        env:
          LINKEDIN_AUTH_DATA: ${{ secrets.LINKEDIN_AUTH_JSON }}
          MAX_PAGES: "2"
          HEADED: "false"
        run: node scripts/scrape-all-jobs.js

      - name: Enrich New Jobs with Regex
        run: node scripts/enrich-jobs-ai.js
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/jobs.json data/scraper-state.json
          git commit -m "Auto-update scraped jobs" || echo "No changes to commit"
          git pull --rebase origin main
          git push
