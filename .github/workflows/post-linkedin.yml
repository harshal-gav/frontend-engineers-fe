name: Post to LinkedIn (Jobs & Employer Ad)

on:
  schedule:
    # Run every 2 hours in a day
    - cron: '0 */2 * * *'
  workflow_dispatch: {}  # Manual trigger for testing

jobs:
  post-to-linkedin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install dotenv
      
      - name: Run LinkedIn Combined Auto-Poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_ACCESS_TOKEN_2: ${{ secrets.LINKEDIN_ACCESS_TOKEN_2 }}
          LINKEDIN_PERSON_ID_2: ${{ secrets.LINKEDIN_PERSON_ID_2 }}
          LINKEDIN_ORG_ID_2: ${{ secrets.LINKEDIN_ORG_ID_2 }}
          LINKEDIN_ACCESS_TOKEN_3: ${{ secrets.LINKEDIN_ACCESS_TOKEN_3 }}
          LINKEDIN_PERSON_ID_3: ${{ secrets.LINKEDIN_PERSON_ID_3 }}
          LINKEDIN_ORG_ID_3: ${{ secrets.LINKEDIN_ORG_ID_3 }}
        run: node scripts/post-to-linkedin.js
